<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Flowboc — Responsive Wireframe Review</title><style>*{box-sizing:border-box}body{margin:0;background:#eae8e2;color:#292633;font:13px/1.5 Arial,sans-serif}.device-toolbar{min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:16px 30px;background:#fcfbf7;border-bottom:1px solid #d8d4df;gap:15px}.device-toolbar a{color:#6355ff;text-decoration:none;font-size:12px}.device-toolbar strong{display:block;font-weight:500;font-size:14px}.device-toolbar small{font-size:10px;color:#9c91a6}.device-buttons{display:flex;gap:7px}.device-buttons button{background:transparent;border:1px solid #d9d3df;border-radius:5px;padding:8px 13px;font:11px Arial,sans-serif;color:#8d7e99;cursor:pointer}.device-buttons button.active{background:#6355ff;color:#fff;border-color:#6355ff}.device-stage{padding:34px 15px;display:flex;align-items:start;justify-content:center;min-height:calc(100dvh - 76px)}.device-shell{border:7px solid #322e3c;border-radius:26px;overflow:hidden;background:#fcfbf7;box-shadow:0 15px 40px #29263320;max-width:100%;transition:width .2s}.device-camera{height:19px;display:flex;align-items:center;justify-content:center;background:#322e3c;color:#c9c2d2;font-size:7px;letter-spacing:1.2px}.device-frame{display:block;width:100%;height:800px;border:0;background:#fcfbf7}.device-caption{font-size:10px;color:#93859f;text-align:center;margin-top:16px}.device-shell.mobile{width:404px}.device-shell.tablet{width:782px}.device-shell.wide{width:1200px}@media(max-width:600px){.device-toolbar{padding:15px;flex-wrap:wrap}.device-buttons{width:100%}.device-stage{padding:20px 8px}.device-frame{height:calc(100dvh - 190px);min-height:500px}.device-shell{border-width:3px;border-radius:15px}.device-camera{height:12px}.device-toolbar strong{font-size:12px}.device-toolbar a{font-size:10px}}</style></head><body><header class="device-toolbar"><div><strong>Flowboc / Responsive wireframe</strong><small>Scroll inside the frame to explore all 12 sections.</small></div><div class="device-buttons" aria-label="Preview width"><button data-width="mobile" class="active" aria-pressed="true">Mobile · 390</button><button data-width="tablet" aria-pressed="false">Tablet · 768</button><button data-width="wide" aria-pressed="false">Wide · 1186</button></div><a href="index.html">Back to full wireframe ↗</a></header><main class="device-stage"><div><div class="device-shell mobile" id="device-shell"><div class="device-camera">FLOWBOC · DESIGN PREVIEW</div><iframe class="device-frame" src="index.html?embedded=true" title="Flowboc responsive landing-page preview"></iframe></div><p class="device-caption">Illustrative content. All booking and setup flows are demos.</p></div></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#device-shell').className='device-shell '+button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button));});}));</script></body></html>
